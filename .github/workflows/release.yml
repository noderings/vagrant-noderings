---
# Publishes the gem to RubyGems.org when a vX.Y.Z tag is pushed, with RubyGems
# trusted publishing (no API key stored in GitHub).
#
# Before the first release, add a trusted publisher on rubygems.org:
#   rubygems.org, your profile, Trusted publishers (or "pending trusted publishers" for a new gem)
#   repository: noderings/vagrant-noderings, workflow: release.yml, environment: rubygems
name: release

"on":
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  rubygems:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
        with:
          await-release: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." --verify-tag || true
