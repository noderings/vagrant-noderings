---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}, Vagrant ${{ matrix.vagrant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3"]
        vagrant: ["v2.4.9"]
    env:
      VAGRANT_VERSION: ${{ matrix.vagrant }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rake rubocop
      - name: Unit tests
        run: bundle exec rake spec
      - name: Build the gem
        run: gem build vagrant-noderings.gemspec

  install:
    name: Install into Vagrant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vagrant
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y vagrant
      - name: Install the plugin and validate a Vagrantfile
        run: |
          gem build vagrant-noderings.gemspec
          vagrant plugin install ./vagrant-noderings-*.gem
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          cat > Vagrantfile <<'VF'
          Vagrant.configure("2") do |config|
            config.vm.provider :noderings do |p|
              p.token = "validation-only"
              p.plan = "SC-GC-1C-1G-20"
              p.country = "United States"
              p.city = "Ashburn"
            end
          end
          VF
          VAGRANT_DEFAULT_PROVIDER=noderings vagrant validate
          vagrant status | grep "not created"
