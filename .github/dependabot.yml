version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      "github-actions":
        patterns:
          - "*"
# No bundler entry: the Gemfile picks the Vagrant source tag from VAGRANT_VERSION (the CI
# matrix tests several Vagrant releases), which Dependabot cannot evaluate.
